# srsRAN gNB — USRP B210 + COTS UE (Pixel) profile: band n78 TDD, 30 kHz SCS, 20 MHz (51 PRB)
#
# Based on: third_party/srsRAN_Project/configs/gnb_rf_b200_tdd_n78_20mhz.yml (release_25_10),
#           the srsRAN "COTS UE" application note (docs.srsran.com) for B210 tuning.
# Changes vs. the sample: AMF/N2 addresses of our Open5GS (ran/core); ru_sdr.expert_cfg.tx_mode
# same-port (single antenna port); log to stdout at level info instead of /tmp/gnb.log at warning
# (procedure-level messages for attach debugging; per-packet detail is debug level and stays off);
# remote_control + JSON metrics + stdout metrics table on. Cell parameters are the sample's except:
# TDD pattern DDDSU 2.5 ms (cell_cfg.tdd_ul_dl_cfg, 2026-09-28), UL OLLA target 10 % with a wider offset
# range and faster step (cell_cfg.pusch, 2026-09-28). tx_mode is back to the default (TX/RX + RX2),
# antennas 1/1, gains 80/40 as in the sample. Each block carries the default it replaces and the reason.
#
# Hardware notes (B210): 20 MHz @ 30 kHz is the reliable maximum over USB 3.0; keep the sample rate
# at 23.04 MHz. Use an external 10 MHz / GPSDO reference if the phone struggles to sync
# (ru_sdr: clock: external). Adjust tx_gain/rx_gain to the antenna setup (start 80/40).
# Antennas (since 2026-09-28 evening): RF A "TX/RX" = DL TX, RF A "RX2" = UL RX (srsRAN default port
# mapping, tx_mode continuous). RF B unused.

cu_cp:
  amf:
    addr: 10.53.1.2                 # Open5GS AMF (ran/core on this host)
    port: 38412
    bind_addr: 10.53.1.1            # host side of the p5g_ran docker bridge
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=64,num_send_frames=64
  srate: 23.04
  otw_format: sc12
  # 80: sample value. 65 was tried and reverted (UE open-loop power control then overdrove the receiver);
  # history in docs/RAN_CONFIG.md.
  tx_gain: 80
  rx_gain: 40
  # clock: external                 # uncomment with a GPSDO / 10 MHz reference
  # tx_mode: default (continuous) = TX on "TX/RX", RX on "RX2", no port switching (srsRAN discussion #77 and
  # the B200 sample). Do not set same-port: measured 78 % PUSCH failure after each DL burst (docs/RAN_CONFIG.md).

cell_cfg:
  dl_arfcn: 632628                  # 3489.42 MHz (n78, GSCN-aligned SSB per the srsRAN sample)
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  # ---- antennas: 1 TX (RF A TX/RX) / 1 RX (RF A RX2) = the srsRAN default ----
  # 2x2 needs four antennas (A/B TX/RX + A/B RX2) and B2x0 refuses unequal TX/RX counts; pcap.mac_type dlt
  # stays because the validator requires it as soon as >= 2 antennas are configured.
  nof_antennas_dl: 1
  nof_antennas_ul: 1
  # ---- UL link adaptation (OLLA) like a production gNB (srsRAN defaults in brackets) ----
  # Measured 2026-09-28 (4-UE and 5-UE runs): PUSCH SINR 30-35 dB, MCS 27 pinned, OLLA offset stuck at
  # its -5 dB floor, new-data BLER 20-32 % against a 1 % target. srsRAN's UL SNR->MCS thresholds are
  # AWGN/ZMQ-calibrated (mcs_calculator.cpp: MCS 27 = 21.7 dB, MCS 19 (top of 64QAM) = 17.1 dB), so
  # leaving MCS 27 from a 33 dB (median) / 37 dB (p90) estimate needs an offset of 11-15 dB and reaching
  # the 64QAM region 16-20 dB. A 5 dB cap can never get there.
  #  - olla_target_bler 0.1 [0.01]: TS 38.214 5.2.2.1 defines CQI at 10 % BLER and 10 % is the usual
  #    first-transmission OLLA target in LTE/NR link adaptation.
  #  - olla_max_snr_offset 20 [5]: covers the whole MCS table from the observed SINR; larger is moot
  #    (effective SNR < 13 dB would only pin MCS 0-12). Bounded per UE, MCS is clamped to 0..27 anyway.
  #  - olla_snr_inc_step 0.02 [0.001]: up 0.02 dB per ACK, down 0.02*(1-0.1)/0.1 = 0.18 dB per NACK. With the
  #    default step a 15 dB move takes ~45 s at 150 grants/s (longer than one 60 s run); 0.02 converges
  #    in ~2 s and dithers +-0.2 dB (< one MCS step). Vendor values are not public.
  pusch:
    olla_target_bler: 0.1
    olla_max_snr_offset: 20
    olla_snr_inc_step: 0.02
  # ---- TDD pattern DDDSU (2.5 ms) instead of the srsRAN default DDDDDDSUUU (5 ms) ----
  # Default when the key is absent (du_high_config.h tdd_ul_dl_pattern_unit_config, release_25_10):
  #   dl_ul_tx_period: 10, nof_dl_slots: 6, nof_dl_symbols: 8, nof_ul_slots: 3, nof_ul_symbols: 0
  #   = DDDDDDSUUU, 3 UL slots per 5 ms (measured in results/20260928-161259-4-UE: PUSCH in slots 7,8,9).
  # DDDSU: 1 UL slot per 2.5 ms -> UL opportunity every 2.5 ms instead of every 5 ms (shorter UL
  # scheduling / HARQ round trip), but UL share drops from 3/10 to 1/5 of the slots (+4 UL symbols in S).
  # Special slot 6 DL / 4 guard / 4 UL symbols: the values of srsRAN's own DDDSU e2e configuration
  # (third_party/srsRAN_Project/tests/e2e/tests/viavi/test_declaration.yml); the validator requires
  # nof_dl_symbols + nof_ul_symbols <= 12 (du_high_config_validator.cpp). PRACH index stays at the
  # default 159 (B4, subframe 9, one PRACH slot -> slot 19 = pattern index 4 = U; prach_helper.cpp).
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5              # slots; 5 slots @ 30 kHz = 2.5 ms (TS 38.331 dl-UL-TransmissionPeriodicity ms2p5)
    nof_dl_slots: 3
    nof_dl_symbols: 6
    nof_ul_slots: 1
    nof_ul_symbols: 4

log:
  filename: stdout                  # run_gnb.sh overrides with --log.filename
  all_level: info

pcap:
  mac_enable: false                 # set true for ground-truth MAC pcap (large; tracer covers most needs)
  mac_type: dlt                     # the validator requires dlt as soon as >= 2 antennas are configured; harmless at 1x1
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap

# JSON metrics (official): the remote-control WebSocket server pushes the per-UE/cell metrics as JSON
# to subscribers; ran/gnb/metrics_json_client.py appends them to <trace_dir>/gnb_metrics.jsonl.
remote_control:
  enabled: true
  bind_addr: 127.0.0.1
  port: 8001

metrics:
  enable_json: true            # JSON metrics -> remote-control subscribers (top-level 'metrics' section)
  autostart_stdout_metrics: true    # 1 s per-UE table -> <trace_dir>/gnb_stdout.log
