#####################################################################
# srsUE (srsRAN_4G, 5G SA) — CODE-TEST TOOL: ZeroMQ loopback against the local gNB
#
# Based on: srsRAN tutorial "srsUE with srsRAN gNB via ZMQ" + srsue/ue.conf.example (release_25_10)
# Pairing:  ran/gnb/configs/gnb_zmq_local.yml (band 3 FDD, 15 kHz, 20 MHz / 106 PRB)
# Subscriber: first row of ran/core/subscriber_db.csv
# Not part of the measurement testbed (UEs there are Pixel phones).
#####################################################################
[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none
mac_nr_filename = /tmp/ue_mac_nr.pcap

[log]
all_level = warning
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
# Own network namespace so video_sender can be run "inside the UE": sudo ip netns exec ue1 ...
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
